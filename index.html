    />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />

    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naufal Atmaja | Data Scientist &amp; ML Engineer" />
    <meta
      name="twitter:description"
      content="Data Scientist &amp; ML Engineer building multimodal deep learning pipelines, computer vision defenses, and scalable analytics."
    />

    <!-- Preconnect & Google Fonts: Sora (Display), Plus Jakarta Sans (Body), JetBrains Mono (Tabular Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash on initial load -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('naoupal-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'dark');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('naoupal-lang');
          if (savedLang === 'id' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#020617] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
